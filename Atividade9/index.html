
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atividade 9 - JavaScript</title>

</head>

<body>

    <h1>Atividade 9 - Funções JavaScript</h1>
    
    <!-- 1) Maior número -->

    <h2>1. Maior número</h2>
    
    <input type="number" id="num1" placeholder="Primeiro número">

    <input type="number" id="num2" placeholder="Segundo número">
    
    <input type="number" id="num3" placeholder="Terceiro número">

    <button onclick="maiorNumero()">Verificar maior</button>
    

    <hr>
    
    
    <!-- 2) Ordem crescente -->
    
    <h2>2. Ordem crescente</h2>
    
    <input type="number" id="ord1" placeholder="Primeiro número">
    
    <input type="number" id="ord2" placeholder="Segundo número">
    
    <input type="number" id="ord3" placeholder="Terceiro número">
    
    <button onclick="ordemCrescente()">Ordenar</button>

    
    <hr>
    
    
    <!-- 3) Palíndromo -->
    
    <h2>3. Verificar palíndromo</h2>
    
    <input type="text" id="palavra" placeholder="Digite uma palavra ou frase">
    
    <button onclick="verificarPalindromo()">Verificar</button>
    
    
    <hr>
    
    
    <!-- 4) Subconjunto -->
    
    <h2>4. Verificar subconjunto</h2>
    
    <input type="text" id="palavra1" placeholder="Primeira palavra">
    
    <input type="text" id="palavra2" placeholder="Segunda palavra">
    
    <button onclick="verificarSubconjunto()">Verificar</button>
    
    
    <hr>
    
    
    <!-- 5) Dia da semana -->
    
    <h2>5. Dia da semana</h2>
    
    <input type="date" id="data">
    
    <button onclick="diaDaSemana()">Verificar dia</button>
    
    <script src="script.js" defer></script>
</body>

</html>
